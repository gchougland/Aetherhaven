<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prefab render</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1a1418;
      }
      #viewer {
        width: 1280px;
        height: 720px;
      }
      #status {
        position: absolute;
        left: 8px;
        top: 8px;
        color: #ccc;
        font: 14px sans-serif;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.172.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.172.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="status">Loading…</div>
    <div id="viewer"></div>
    <script type="module">
      import { PrefabViewer } from "/prefab-viewer/PrefabViewer.js?v=5";

      window.__PREFAB_RENDER_READY__ = false;
      window.__PREFAB_RENDER_ERROR__ = null;

      const params = new URLSearchParams(location.search);
      const prefabUrl = params.get("prefabUrl");
      const statusEl = document.getElementById("status");

      async function main() {
        if (!prefabUrl) {
          throw new Error("prefabUrl required");
        }
        const viewer = new PrefabViewer(document.getElementById("viewer"), {
          interactive: false,
          assetBase: "/hytale-assets",
        });
        await viewer.loadPrefabUrl(prefabUrl, {
          onProgress: (done, total) => {
            statusEl.textContent = `Rendering ${done}/${total}`;
          },
        });
        // Settle textures / one more frame
        await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
        statusEl.textContent = "Ready";
        window.__PREFAB_VIEWER__ = viewer;
        window.__PREFAB_RENDER_READY__ = true;
      }

      main().catch((err) => {
        console.error(err);
        statusEl.textContent = String(err?.message || err);
        window.__PREFAB_RENDER_ERROR__ = String(err?.message || err);
        window.__PREFAB_RENDER_READY__ = false;
      });
    </script>
  </body>
</html>
