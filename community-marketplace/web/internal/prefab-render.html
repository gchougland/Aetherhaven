<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prefab render</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1a1418;
      }
      html.icon-mode,
      html.icon-mode body {
        background: transparent !important;
      }
      #viewer {
        width: 100vw;
        height: 100vh;
        background: transparent;
      }
      #status {
        position: absolute;
        left: 8px;
        top: 8px;
        color: #ccc;
        font: 14px sans-serif;
        z-index: 2;
        pointer-events: none;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.172.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.172.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="status">Loading…</div>
    <div id="viewer"></div>
    <script type="module">
      import { PrefabViewer, PREFAB_VIEWER_TRANSFORM_REV } from "/prefab-viewer/PrefabViewer.js?v=30";

      window.__PREFAB_RENDER_READY__ = false;
      window.__PREFAB_RENDER_ERROR__ = null;

      const params = new URLSearchParams(location.search);
      const prefabUrl = params.get("prefabUrl");
      // Default interactive for local debugging; ?interactive=0 keeps screenshot mode.
      const interactive = params.get("interactive") !== "0";
      const iconMode = params.get("mode") === "icon";
      const statusEl = document.getElementById("status");
      if (!interactive && statusEl) {
        statusEl.style.display = "none";
      }
      if (iconMode) {
        document.documentElement.classList.add("icon-mode");
        document.body.style.background = "transparent";
      }

      async function main() {
        if (!prefabUrl) {
          throw new Error("prefabUrl required");
        }
        const viewer = new PrefabViewer(document.getElementById("viewer"), {
          interactive,
          assetBase: "/hytale-assets",
          fullscreenButton: false,
          hideGrid: iconMode,
          transparentBackground: iconMode,
        });
        await viewer.loadPrefabUrl(prefabUrl, {
          onProgress: (done, total) => {
            statusEl.textContent = `Rendering ${done}/${total} (${PREFAB_VIEWER_TRANSFORM_REV})`;
          },
        });
        // Settle textures / a few more frames so models finish uploading before capture.
        await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
        if (iconMode) {
          await new Promise((r) => setTimeout(r, 120));
          viewer.renderer.render(viewer.scene, viewer.camera);
        }
        statusEl.textContent = interactive
          ? `${PREFAB_VIEWER_TRANSFORM_REV} · drag to orbit · scroll to zoom`
          : `Ready (${PREFAB_VIEWER_TRANSFORM_REV})`;
        window.__PREFAB_VIEWER__ = viewer;
        window.__PREFAB_RENDER_READY__ = true;
      }

      main().catch((err) => {
        console.error(err);
        statusEl.textContent = String(err?.message || err);
        window.__PREFAB_RENDER_ERROR__ = String(err?.message || err);
        window.__PREFAB_RENDER_READY__ = false;
      });
    </script>
  </body>
</html>
