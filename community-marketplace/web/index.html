<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aetherhaven Community Buildings</title>
    <link rel="icon" href="/assets/favicon.png?v=2" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css?v=35" />
  </head>
  <body>
    <header class="site-header">
      <div class="wrap">
        <div class="site-header-inner">
          <div class="site-header-start">
            <a href="/" class="site-brand">
              <img
                src="/assets/logo.png?v=2"
                alt="Aetherhaven: Foundations of Industry"
                class="site-logo"
              />
            </a>
            <nav class="site-primary-nav" aria-label="Main">
              <a href="/" aria-current="page">Community Builds</a>
              <a href="/wiki.html">Wiki</a>
              <a href="/submissions.html">My Submissions</a>
            </nav>
          </div>
          <div class="site-header-end">
            <nav class="site-social-badges" aria-label="Community links">
              <a
                href="https://discord.gg/qHGTejm3vM"
                target="_blank"
                rel="noopener noreferrer"
              >
                <img
                  src="https://img.shields.io/discord/1468449387964530791?style=for-the-badge&amp;logo=discord&amp;logoColor=white&amp;label=Discord&amp;color=5865F2"
                  alt="Join Discord"
                  height="28"
                />
              </a>
              <a
                href="https://www.patreon.com/c/Hexvane"
                target="_blank"
                rel="noopener noreferrer"
              >
                <img
                  src="https://img.shields.io/badge/Patreon-F96854?style=for-the-badge&amp;logo=patreon&amp;logoColor=white"
                  alt="Patreon"
                  height="28"
                />
              </a>
            </nav>
            <div id="accountMenu" class="account-menu"></div>
          </div>
        </div>
      </div>
    </header>

    <aside id="ad-browse-header" class="ad-slot wrap" aria-label="Advertisement" hidden></aside>

    <main class="wrap">
      <section id="status" class="status" hidden></section>
      <section>
        <div class="section-title">
          <h2>Community builds</h2>
          <div class="ornament-divider" aria-hidden="true"></div>
        </div>
        <section id="newestCarouselSection" class="newest-carousel-section" hidden>
          <div class="newest-carousel-heading">
            <h3>Newest builds</h3>
          </div>
          <div class="newest-carousel" id="newestCarousel">
            <button
              type="button"
              class="newest-carousel-nav newest-carousel-nav--prev"
              id="newestCarouselPrev"
              aria-label="Previous newest builds"
            >
              &#8249;
            </button>
            <div
              id="newestCarouselTrack"
              class="newest-carousel-track"
              tabindex="0"
              role="list"
              aria-label="Newest approved builds"
            ></div>
            <button
              type="button"
              class="newest-carousel-nav newest-carousel-nav--next"
              id="newestCarouselNext"
              aria-label="Next newest builds"
            >
              &#8250;
            </button>
          </div>
        </section>
        <div class="catalog-toolbar" id="catalogToolbar" hidden>
          <label class="catalog-search">
            <span class="visually-hidden">Search builds</span>
            <input
              type="search"
              id="catalogSearch"
              placeholder="Search by name, author, or tags…"
              autocomplete="off"
            />
          </label>
          <label class="catalog-filter">
            <span>Author</span>
            <select id="catalogAuthorFilter">
              <option value="">All authors</option>
            </select>
          </label>
          <label class="catalog-filter">
            <span>Style</span>
            <select id="catalogStyleFilter">
              <option value="">All styles</option>
            </select>
          </label>
          <label class="catalog-filter">
            <span>Building type</span>
            <select id="catalogTypeFilter">
              <option value="">All types</option>
            </select>
          </label>
          <label class="catalog-filter">
            <span>Sort</span>
            <select id="catalogSort">
              <option value="upvotes" selected>Most upvoted</option>
              <option value="downloads">Most downloads</option>
              <option value="newest">Newest</option>
              <option value="name-asc">Name A–Z</option>
              <option value="name-desc">Name Z–A</option>
            </select>
          </label>
          <label class="catalog-favorites-filter" for="catalogFavoritesOnly">
            <input type="checkbox" id="catalogFavoritesOnly" />
            <span>Favorites only</span>
          </label>
          <button type="button" class="secondary" id="catalogClearFilters">Clear</button>
          <p class="catalog-result-count" id="catalogResultCount" aria-live="polite"></p>
        </div>
        <div id="catalog" class="catalog-grid"></div>
        <nav id="catalogPagination" class="catalog-pagination" aria-label="Catalog pages" hidden></nav>
      </section>
      <p class="site-footer-meta"><a href="/privacy.html">Privacy</a></p>
    </main>

    <script src="/app.js?v=30"></script>
    <script src="/ads.js?v=1"></script>
    <script>
      loadCatalog();
      refreshAuthNav();
    </script>
  </body>
</html>
