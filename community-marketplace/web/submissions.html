<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Submissions — Aetherhaven Community</title>
    <link rel="icon" href="/assets/favicon.png?v=4" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css?v=49" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.172.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.172.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <header class="site-header">
      <div class="wrap">
        <div class="site-header-inner">
          <div class="site-header-start">
            <a href="/" class="site-brand">
              <img
                src="/assets/logo.png?v=4"
                alt="Aetherhaven: Festivals of Orbis"
                class="site-logo"
              />
            </a>
            <nav class="site-primary-nav" aria-label="Main">
              <a href="/">Community Builds</a>
              <a href="/wiki.html">Wiki</a>
              <a href="/submissions.html" aria-current="page">My Submissions</a>
            </nav>
          </div>
          <div class="site-header-end">
            <nav class="site-social-badges" aria-label="Community links">
              <a
                href="https://discord.gg/qHGTejm3vM"
                target="_blank"
                rel="noopener noreferrer"
              >
                <img
                  src="https://img.shields.io/discord/1468449387964530791?style=for-the-badge&amp;logo=discord&amp;logoColor=white&amp;label=Discord&amp;color=5865F2"
                  alt="Join Discord"
                  height="28"
                />
              </a>
              <a
                href="https://www.patreon.com/c/Hexvane"
                target="_blank"
                rel="noopener noreferrer"
              >
                <img
                  src="https://img.shields.io/badge/Patreon-F96854?style=for-the-badge&amp;logo=patreon&amp;logoColor=white"
                  alt="Patreon"
                  height="28"
                />
              </a>
            </nav>
            <div id="accountMenu" class="account-menu"></div>
          </div>
        </div>
      </div>
    </header>
    <main class="wrap">
      <section class="card submissions-page">
        <div class="section-title">
          <h2>Your submissions</h2>
          <div class="ornament-divider" aria-hidden="true"></div>
        </div>
        <p class="meta submissions-intro">
          Pending builds can be withdrawn. Published builds can be edited or removed from the marketplace.
          Click a published submission to edit its name, description, costs, and screenshots.
        </p>
        <div class="catalog-toolbar submissions-toolbar" id="submissionsToolbar" hidden>
          <label class="catalog-search">
            <span class="visually-hidden">Search submissions</span>
            <input
              type="search"
              id="submissionsSearch"
              placeholder="Search by name or id…"
              autocomplete="off"
            />
          </label>
          <div class="submissions-status-chips" id="submissionsStatusChips" role="group" aria-label="Filter by status">
            <button type="button" class="submissions-chip is-active" data-status="all" aria-pressed="true">
              All <span class="submissions-chip-count" data-count-for="all">0</span>
            </button>
            <button type="button" class="submissions-chip" data-status="pending" aria-pressed="false">
              Pending <span class="submissions-chip-count" data-count-for="pending">0</span>
            </button>
            <button type="button" class="submissions-chip" data-status="approved" aria-pressed="false">
              Published <span class="submissions-chip-count" data-count-for="approved">0</span>
            </button>
            <button type="button" class="submissions-chip" data-status="rejected" aria-pressed="false">
              Rejected <span class="submissions-chip-count" data-count-for="rejected">0</span>
            </button>
          </div>
          <label class="catalog-filter">
            <span>Style</span>
            <select id="submissionsStyleFilter">
              <option value="">All styles</option>
            </select>
          </label>
          <label class="catalog-filter">
            <span>Sort</span>
            <select id="submissionsSort">
              <option value="newest" selected>Newest</option>
              <option value="name-asc">Name A–Z</option>
              <option value="name-desc">Name Z–A</option>
            </select>
          </label>
          <button type="button" class="secondary" id="submissionsClearFilters">Clear</button>
          <p class="catalog-result-count" id="submissionsResultCount" aria-live="polite"></p>
        </div>
        <div id="mySubmissions" class="submission-list"></div>
      </section>
    </main>
    <script type="module">
      import { PrefabViewer, mountPrefabViewer, PREFAB_VIEWER_TRANSFORM_REV } from "/prefab-viewer/PrefabViewer.js?v=44";
      window.PrefabViewerAPI = { PrefabViewer, mountPrefabViewer, PREFAB_VIEWER_TRANSFORM_REV };
    </script>
    <script src="/app.js?v=49"></script>
    <script>
      loadSubmissions();
    </script>
  </body>
</html>
