<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin — Aetherhaven Community</title>
    <link rel="icon" href="/assets/favicon.png?v=2" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css?v=21" />
  </head>
  <body>
    <header class="site-header">
      <div class="wrap">
        <div class="site-header-inner">
          <div class="site-header-start">
            <a href="/" class="site-brand">
              <img
                src="/assets/logo.png?v=2"
                alt="Aetherhaven: Foundations of Industry"
                class="site-logo"
              />
            </a>
            <nav class="site-primary-nav" aria-label="Main">
              <a href="/">Community Builds</a>
              <a href="/submissions.html">My Submissions</a>
            </nav>
          </div>
          <div id="accountMenu" class="account-menu"></div>
        </div>
      </div>
    </header>
    <main class="wrap">
      <section class="card">
        <h2>Pending submissions</h2>
        <div id="adminQueue"></div>
      </section>
      <section class="card">
        <h2>Pending screenshots</h2>
        <p class="meta">Approve screenshots before they appear in the public build gallery.</p>
        <div id="adminScreenshotQueue"></div>
      </section>
      <section class="card">
        <h2>Published buildings</h2>
        <p class="meta">Browse approved builds and remove any from the public catalog. Players who already downloaded a build keep their local copy.</p>
        <div id="adminCatalog" class="catalog-grid"></div>
      </section>
    </main>
    <script src="/app.js?v=16"></script>
    <script>
      loadAdminPage();
    </script>
  </body>
</html>
